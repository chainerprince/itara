# Local Postgres + pgvector for development. The schema is applied on first start.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - ./memory/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
