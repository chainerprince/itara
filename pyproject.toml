[project]
name = "memory-gateway"
version = "0.1.0"
description = "Self-hosted Llama gateway with shared team memory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "fastembed>=0.4",
    "datasets>=5.1.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "modal>=1.6.2",
    "nbstripout>=0.9.1",
    "pandas>=3.1.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["slow: end-to-end runs on real dataset items (run with -m slow)"]
addopts = "-m 'not slow'"
