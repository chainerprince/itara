<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itara · shine a light on what your team already has</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d11; --fg: #e9eef3; --muted: #8a97a6; --faint: #4f5a66; --line: rgba(255,255,255,.09);
    --warm: #ffc871; --green: #2fd17a; --violet: #8f7bff; --red: #ff6b6b; --xray: #9fe6ff;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: Inter, ui-sans-serif, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }

  .chapter { position: fixed; left: clamp(24px, 4vw, 64px); top: clamp(24px, 6vh, 64px); max-width: min(560px, 42vw);
    transition: opacity .45s ease, transform .45s ease; pointer-events: none; }
  .chapter.out { opacity: 0; transform: translateY(-8px); }
  .kicker { font: 500 13px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--warm); }
  .chapter h1 { font-weight: 600; font-size: clamp(26px, 2.6vw, 46px); line-height: 1.08; letter-spacing: -.025em; margin: 16px 0 0; }
  .chapter h1:empty { display: none; }
  .chapter h1, .kicker { text-shadow: 0 2px 28px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.6); }
  body.title .chapter { top: auto; bottom: 15vh; max-width: min(820px, 72vw); }
  body.title .chapter h1 { font-size: clamp(56px, 7vw, 120px); letter-spacing: -.04em; }

  #hero { position: fixed; right: clamp(24px, 4vw, 64px); top: clamp(24px, 6vh, 64px); text-align: right;
    opacity: 0; transition: opacity .4s ease; pointer-events: none; color: var(--fg); }
  #hero.on { opacity: 1; }
  #hero b { display: block; font-size: clamp(56px, 6.5vw, 112px); font-weight: 600; letter-spacing: -.045em; line-height: 1;
    font-variant-numeric: tabular-nums; text-shadow: 0 2px 28px rgba(0,0,0,.9); }
  #hero span { display: block; margin-top: 10px; font: 500 13px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  #hero svg { display: none; width: clamp(110px, 10vw, 168px); height: auto; margin: 0 0 14px auto; }
  #hero.ring svg { display: block; }
  #hero circle { fill: none; stroke-width: 9; }
  #hero .track { stroke: rgba(255,255,255,.08); }
  #hero .arc { stroke: currentColor; stroke-linecap: round; stroke-dasharray: 326.73; stroke-dashoffset: 326.73;
    transform: rotate(-90deg); transform-origin: 60px 60px; transition: stroke-dashoffset .5s ease; }
  #hero.warn { color: var(--red); } #hero.good { color: var(--green); } #hero.idle { color: #6b7785; }
  #hero.idle b { color: var(--fg); }

  #meters { position: fixed; right: clamp(24px, 4vw, 64px); bottom: clamp(72px, 10vh, 110px); width: 300px;
    display: flex; flex-direction: column; gap: 14px; padding: 6px 20px 18px; border-radius: 14px;
    background: rgba(10,13,17,.66); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: opacity .4s ease; pointer-events: none; }
  #meters.on { opacity: 1; }
  .meter { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .m-label { font-size: 12.5px; color: var(--muted); }
  .m-value { font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .meter.warn .m-value { color: var(--red); }
  .meter.good .m-value { color: var(--green); }
  .meter.violet .m-value { color: var(--violet); }
  .meter.warm .m-value { color: var(--warm); }
  .m-foot { font-size: 11.5px; line-height: 1.45; color: var(--faint); padding-top: 10px; }

  #labels { position: fixed; inset: 0; pointer-events: none; }
  .tag { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12.5px; font-weight: 500; color: #d3dbe4;
    padding: 5px 11px 5px 9px; border-radius: 999px; background: rgba(13,17,23,.74); border: 1px solid rgba(255,255,255,.09);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; gap: 7px;
    opacity: 0; transition: opacity .35s ease; }
  .tag.on { opacity: 1; }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #7d8a99; }
  .tag.green::before { background: var(--green); }
  .tag.violet::before { background: var(--violet); }
  .tag.warn::before { background: var(--red); }
  .tag.warm::before { background: var(--warm); }
  .tag.xray::before { background: var(--xray); }
  .tag.num, .tag.plain { padding: 5px 11px; }
  .tag.num::before, .tag.plain::before, .tag.z::before { display: none; }
  .tag.num { font-size: 18px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .tag.num.big { font-size: 26px; }
  .tag.num.green { color: var(--green); } .tag.num.warn { color: var(--red); } .tag.num.warm { color: var(--warm); }
  .tag.num.xray { color: var(--xray); } .tag.num.violet { color: var(--violet); }
  .tag.z { background: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; font-style: italic; font-weight: 600; color: #8a97a6; }

  nav.dots { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 26px; align-items: flex-end; }
  nav.dots .sec { display: flex; flex-direction: column; gap: 8px; }
  nav.dots .sec i { font: 500 10px/1 var(--mono); font-style: normal; letter-spacing: .08em; color: var(--faint); white-space: nowrap; }
  nav.dots .sec.on i { color: #9aa6b3; }
  nav.dots .row { display: flex; gap: 6px; }
  nav.dots button { width: 16px; height: 3px; border: 0; padding: 0; border-radius: 2px; cursor: pointer;
    background: rgba(255,255,255,.14); transition: background .3s, width .3s; }
  nav.dots button.on { background: var(--warm); width: 30px; }
  .hint { position: fixed; left: clamp(24px, 4vw, 64px); bottom: 64px; font: 500 11px/1 var(--mono); color: var(--faint); letter-spacing: .06em; }
  .hint b { color: #7a8693; font-weight: 500; }
  body.clean nav.dots, body.clean .hint { display: none; }
  @media (max-width: 1100px) { .hint { display: none; } }

  .boot { position: fixed; inset: 0; display: grid; place-items: center; font: 500 12px var(--mono); color: var(--faint); }
</style>
</head>
<body>
<div class="boot" id="boot">loading</div>
<canvas id="stage" aria-label="Animated 3D explanation of Itara"></canvas>
<div class="vignette"></div>
<div id="labels"></div>
<header class="chapter" id="chapter"><div class="kicker"></div><h1></h1></header>
<div id="hero"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="arc" cx="60" cy="60" r="52"/></svg><b></b><span></span></div>
<aside id="meters"></aside>
<nav class="dots" id="dots"></nav>
<div class="hint"><b>← →</b> scenes &nbsp; <b>1–4</b> sections &nbsp; <b>A</b> autoplay &nbsp; <b>R</b> replay &nbsp; <b>H</b> hide bar &nbsp; <b>F</b> full screen</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- palette ----------
const C = {
  bg: 0x0a0d11, block: 0x242e3a, edge: 0x6a7d93, stripe: 0x55677b,
  warm: 0xffc871, green: 0x2fd17a, team: 0x1f9d55, violet: 0x7c66e8,
  amber: 0xff9f43, red: 0xff5d5d, xray: 0x9fe6ff, shell: 0x8fb4d9, text: 0xcfd8e3,
  pg: 0x4a7bb0, wool: 0xe6d8bd, paper: 0xd9d1bf,
};
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = x => Math.min(1, Math.max(0, x));
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let now = 0;

// ---------- renderer ----------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);
scene.fog = new THREE.Fog(C.bg, 24, 50);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);

const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.5, 0.86);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- tweens ----------
const ease = {
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  lin: t => t,
};
let tweens = [];
function tween(dur, onUpdate, { delay = 0, e = ease.io, done } = {}) {
  const tw = { t: -delay, dur, onUpdate, e, done, finished: false };
  tweens.push(tw);
  return tw;
}
const later = (delay, fn) => tween(0, null, { delay, done: fn });
function stepTweens(dt) {
  for (const tw of tweens) {
    if (tw.finished) continue;
    tw.t += dt;
    if (tw.t < 0) continue;
    const k = tw.dur > 0 ? Math.min(tw.t / tw.dur, 1) : 1;
    if (tw.onUpdate) tw.onUpdate(tw.e(k), k);
    if (k >= 1) { tw.finished = true; if (tw.done) tw.done(); }
  }
  tweens = tweens.filter(t => !t.finished);
}
function tweenProp(obj, key, to, dur, opts) {
  let from;
  return tween(dur, k => { if (from === undefined) from = obj[key]; obj[key] = lerp(from, to, k); }, opts);
}
function tweenVec(vec, to, dur, opts) {
  let from;
  const target = to.clone();
  return tween(dur, k => { if (!from) from = vec.clone(); vec.lerpVectors(from, target, k); }, opts);
}
function tweenColor(color, to, dur, opts) {
  let from;
  const target = new THREE.Color(to);
  return tween(dur, k => { if (!from) from = color.clone(); color.copy(from).lerp(target, k); }, opts);
}
function tweenScale(obj, to, dur, opts) {
  let from;
  return tween(dur, k => { if (from === undefined) from = obj.scale.x; obj.scale.setScalar(Math.max(.001, lerp(from, to, k))); }, opts);
}

// ---------- world ----------
const hemi = new THREE.HemisphereLight(0x9fb3c8, 0x0a0d11, .5);
const key = new THREE.DirectionalLight(0xdfe8f2, .6);
key.position.set(6, 12, 8);
const rim = new THREE.DirectionalLight(0x6f8fb0, .3);
rim.position.set(-8, 6, -10);
scene.add(hemi, key, rim);
const world = { k: 1 };

const ground = new THREE.Mesh(new THREE.PlaneGeometry(140, 140),
  new THREE.MeshStandardMaterial({ color: 0x0e1217, roughness: .95 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(140, 140, 0x18202a, 0x141a22);
grid.position.y = .002;
grid.material.transparent = true;
grid.material.opacity = .55;
scene.add(grid);

const transient = new THREE.Group();
scene.add(transient);
function clearTransient() {
  for (const o of [...transient.children]) {
    o.traverse(n => {
      if (n.userData.ownGeo && n.geometry) n.geometry.dispose();
      if (n.material) n.material.dispose();
    });
    transient.remove(o);
  }
  for (const L of labels.filter(L => L.temp)) L.el.remove();
  labels = labels.filter(L => !L.temp);
}
// Factories build fresh geometry; mark it so clearTransient frees it.
const own = obj => { obj.traverse(n => { n.userData.ownGeo = true; }); return obj; };
function addEdges(mesh, color, opacity = 1, angle = 1) {
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, angle),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity, toneMapped: false }));
  mesh.add(e);
  return e;
}
const bright = (color, k) => new THREE.Color(color).multiplyScalar(k);
const basic = (color, k = 1, extra = {}) => new THREE.MeshBasicMaterial({ color: bright(color, k), toneMapped: false, ...extra });
function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(.35, 'rgba(255,255,255,.35)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowTex = glowTexture();
function glowSprite(color, size, opacity = .8) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  s.scale.setScalar(size);
  return s;
}

// ---------- the stage: each scene says which pieces are on it ----------
const STAGE = {};
function onStage(name, obj, s = 1) {
  STAGE[name] = { obj, p: obj.position.clone(), s };
  obj.visible = false;
  obj.scale.setScalar(.001);
}
function setStage(sc, instant) {
  const show = sc.show || [];
  for (const [name, st] of Object.entries(STAGE)) {
    const o = st.obj;
    if (show.includes(name)) {
      const [p, s, delay = .25] = sc.pose?.[name] || [st.p, st.s];
      if (instant) { o.visible = true; o.position.copy(p); o.scale.setScalar(s); continue; }
      if (!o.visible) { o.visible = true; o.position.copy(p); o.scale.setScalar(.001); }
      tweenVec(o.position, p, 1.2);
      tweenScale(o, s, .8, { delay, e: ease.out });
    } else if (o.visible) {
      if (instant) { o.visible = false; continue; }
      tweenScale(o, .001, .45, { done: () => { o.visible = false; } });
    }
  }
}

// ---------- the repository: pieces ----------
const repo = new THREE.Group();
repo.position.set(-7, 0, -1);
scene.add(repo);
const slab = new THREE.Mesh(new THREE.BoxGeometry(5.6, .12, 4.2),
  new THREE.MeshStandardMaterial({ color: 0x18202a, roughness: .8 }));
slab.position.y = .06;
slab.receiveShadow = true;
repo.add(slab);
addEdges(slab, 0x46566a);

const blockGeo = new THREE.BoxGeometry(.9, .9, .9);
const blockEdgeGeo = new THREE.EdgesGeometry(blockGeo);
const stripeGeo = new THREE.BoxGeometry(1, .045, .012);
const blocks = [];
for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
  const mat = new THREE.MeshStandardMaterial({ color: C.block, roughness: .45, metalness: .15, emissive: 0x000000 });
  const b = new THREE.Mesh(blockGeo, mat);
  b.castShadow = b.receiveShadow = true;
  const edge = new THREE.LineSegments(blockEdgeGeo, new THREE.LineBasicMaterial({ color: C.edge, toneMapped: false }));
  b.add(edge);
  const sm = new THREE.MeshBasicMaterial({ color: C.stripe, toneMapped: false });
  for (let s = 0; s < 4; s++) {
    const w = .18 + rnd() * .4;
    const indent = (s === 1 || s === 2) ? .08 : 0;
    const st = new THREE.Mesh(stripeGeo, sm);
    st.scale.x = w;
    st.position.set(-.3 + indent + w / 2, .2 - s * .12, .456);
    b.add(st);
  }
  b.position.set((c - 1.5) * 1.15, .57, (r - 1) * 1.15);
  repo.add(b);
  b.userData = { edge, stripeMat: sm, gk: 0, gc: new THREE.Color(C.amber),
    home: b.position.clone().add(repo.position) };
  blocks.push(b);
}
const NEED = 6;
const topOf = i => blocks[i].userData.home.clone().add(v3(0, .46, 0));
function setRise(b, k) { b.scale.setScalar(Math.max(.001, k)); b.position.y = .12 + .45 * k; }

const warmC = new THREE.Color(C.warm), baseStripe = new THREE.Color(C.stripe), baseEdge = new THREE.Color(C.edge), tmpC = new THREE.Color();
function updateBlocks() {
  for (const b of blocks) {
    const u = b.userData;
    let k = u.gk, col = u.gc;
    if (torch.lightsBlocks && torch.on > .01) {
      const d = Math.hypot(u.home.x - torch.target.x, u.home.z - torch.target.z);
      const bk = THREE.MathUtils.smoothstep(1.35 - d, 0, 1) * torch.on * .55;
      if (bk > k) { k = bk; col = warmC; }
    }
    b.material.emissive.copy(col);
    b.material.emissiveIntensity = k;
    u.stripeMat.color.copy(baseStripe).lerp(tmpC.copy(col).multiplyScalar(1.6), clamp01(k));
    u.edge.material.color.copy(baseEdge).lerp(tmpC.copy(col).multiplyScalar(1.4), clamp01(k));
  }
}
function glowBlock(i, color, peak, delay = 0, hold = .7, stay = false) {
  const u = blocks[i].userData;
  later(delay, () => u.gc.set(color));
  tween(.35, k => { u.gk = lerp(0, peak, k); }, { delay });
  if (!stay) tween(.8, k => { u.gk = lerp(peak, 0, k); }, { delay: delay + .35 + hold });
}

// ---------- RAM: a memory stick in its slot ----------
const ram = new THREE.Group();
ram.position.set(-.5, 0, 1.5);
scene.add(ram);
const ramChips = [];
{
  const slot = new THREE.Mesh(new THREE.BoxGeometry(6.9, .42, .46), new THREE.MeshStandardMaterial({ color: 0x151b23, roughness: .6 }));
  slot.position.y = .21;
  addEdges(slot, 0x3a4756);
  const pcb = new THREE.Mesh(new THREE.BoxGeometry(6.4, 1.7, .08), new THREE.MeshStandardMaterial({ color: 0x0f3b2c, roughness: .6, metalness: .2 }));
  pcb.position.y = 1.25;
  addEdges(pcb, 0x2f7a5a);
  const pinGeo = new THREE.BoxGeometry(.09, .22, .1);
  const pinMat = new THREE.MeshStandardMaterial({ color: 0xc9a24a, metalness: .9, roughness: .3, emissive: 0x3a2a08 });
  for (let i = 0; i < 40; i++) {
    if (i === 17) continue;
    const p = new THREE.Mesh(pinGeo, pinMat);
    p.position.set(-2.925 + i * .15, .53, 0);
    ram.add(p);
  }
  ram.add(slot, pcb);
  const chipGeo = new THREE.BoxGeometry(.5, .62, .07);
  for (let i = 0; i < 10; i++) {
    const mat = new THREE.MeshStandardMaterial({ color: 0x161a20, roughness: .4, metalness: .3, emissive: C.green, emissiveIntensity: 0 });
    const chip = new THREE.Mesh(chipGeo, mat);
    chip.position.set((i - 4.5) * .6, 1.35, .075);
    addEdges(chip, 0x3c4a58);
    // the same file, written into every chip
    const glyphMat = basic(C.amber, 1.6);
    const glyph = new THREE.Group();
    [.3, .2, .26].forEach((w, s) => {
      const st = new THREE.Mesh(stripeGeo, glyphMat);
      st.scale.set(w, 1, 1);
      st.position.set(-.12 + (s === 1 ? .05 : 0) + w / 2, .14 - s * .12, .04);
      glyph.add(st);
    });
    glyph.visible = false;
    chip.add(glyph);
    ram.add(chip);
    ramChips.push({ mesh: chip, k: 0, col: new THREE.Color(C.green), glyph, glyphMat });
  }
}
const chipPos = i => ram.position.clone().add(v3((i - 4.5) * .6, 1.35, .14));
function chipTo(i, k, color, dur = .3, delay = 0) {
  const c = ramChips[i];
  later(delay, () => c.col.set(color));
  tweenProp(c, 'k', k, dur, { delay });
}
function updateRam() {
  for (const c of ramChips) { c.mesh.material.emissive.copy(c.col); c.mesh.material.emissiveIntensity = c.k; }
}

// ---------- people ----------
function makePerson(color, pos, parent = scene) {
  const g = new THREE.Group();
  g.position.copy(pos);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: .55, metalness: .05, emissive: color, emissiveIntensity: .15 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.3, .62, 8, 24), mat);
  body.position.y = .62;
  const head = new THREE.Mesh(new THREE.SphereGeometry(.25, 32, 16), mat);
  head.position.y = 1.5;
  body.castShadow = head.castShadow = true;
  const ring = new THREE.Mesh(new THREE.RingGeometry(.46, .5, 64),
    new THREE.MeshBasicMaterial({ color: bright(color, 1.8), toneMapped: false, transparent: true, opacity: .85, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = .01;
  g.add(body, head, ring);
  g.userData.mat = mat;
  parent.add(g);
  return g;
}
const P = {
  t4: v3(-5.0, 0, 4.2), alice: v3(-3.2, 0, 4.6), bob: v3(-1.4, 0, 5.0), t3: v3(.4, 0, 5.0), t5: v3(2.1, 0, 4.4),
  olga: v3(4.9, 0, 1.9), modelIn: v3(3, 2.6, .55), modelChest: v3(3, 2.0, -.5),
};

const cellGeo = new THREE.BoxGeometry(.17, .14, .5);
function makeKV(parent) {
  const g = { cells: [], val: [], col: [] };
  for (let L = 0; L < 8; L++) for (let c = 0; c < 7; c++) {
    const m = new THREE.Mesh(cellGeo, new THREE.MeshStandardMaterial({ color: 0x2a3542, roughness: .6, emissive: C.green, emissiveIntensity: 0 }));
    m.position.set((c - 3) * .21, 1.05 + L * .26, 0);
    parent.add(m);
    g.cells.push(m); g.val.push(0); g.col.push(new THREE.Color(C.green));
  }
  return g;
}
const KN = 56, KW = 10;
function kvSweep(g, from, to, color, dur, delay = 0) {
  const col = new THREE.Color(color);
  tween(dur, k => {
    for (let i = 0; i < KN; i++) {
      const l = clamp01((k * (KN + KW) - i) / KW);
      if (l > 0) { g.val[i] = lerp(from, to, l); g.col[i].copy(col); }
    }
  }, { delay, e: ease.lin });
}
function kvSettle(g, to, color, dur, delay = 0) {
  const col = new THREE.Color(color);
  let from, fromC;
  tween(dur, k => {
    if (!from) { from = g.val.slice(); fromC = g.col.map(c => c.clone()); }
    for (let i = 0; i < KN; i++) { g.val[i] = lerp(from[i], to, k); g.col[i].copy(fromC[i]).lerp(col, k); }
  }, { delay });
}
function kvReset(g) { for (let n = 0; n < KN; n++) { g.val[n] = 0; g.col[n].set(C.green); } }
function updateKV(g) {
  for (let i = 0; i < KN; i++) {
    const m = g.cells[i].material;
    m.emissive.copy(g.col[i]);
    m.emissiveIntensity = g.val[i] * 1.5;
  }
}

const lensPos = new THREE.Vector3(), toTorch = new THREE.Vector3();
function updateTorch(time) {
  const g = torch.group;
  g.position.copy(torch.pos);
  g.position.y += Math.sin(time * 1.3) * .07;
  g.updateMatrixWorld();
  torch.pivot.lookAt(torch.target);
  lensPos.copy(g.position);
  const dist = lensPos.distanceTo(torch.target);
  const on = torch.on * (g.scale.x > .01 ? 1 : 0);
  torch.beam.visible = on > .003;
  torch.beam.scale.set(torch.radius, torch.radius, dist);
  torch.beamMat.uniforms.uI.value = on * .36;
  torch.beamMat.uniforms.uColor.value.copy(torch.color);
  torch.lensMat.color.copy(torch.color).multiplyScalar(.18 + on * 3.5);
  torch.spot.color.copy(torch.color);
  torch.spot.intensity = on * 7;
  torch.spot.position.copy(lensPos);
  torch.spot.target.position.copy(torch.target);
  torch.spot.angle = Math.atan(torch.radius * 1.3 / dist);
  toTorch.copy(lensPos).sub(torch.target).normalize();
  torch.hit.position.copy(torch.target).addScaledVector(toTorch, .03);
  torch.hit.lookAt(lensPos);
  torch.hit.scale.setScalar(torch.radius * 2.6);
  torch.hit.material.color.copy(torch.color);
  torch.hit.material.opacity = on * .7;
}
function ignite(delay = 0, dur = 1.1) {
  tween(dur, (e, k) => { torch.on = k < 1 ? e * (.7 + .3 * Math.abs(Math.sin(k * 38))) : 1; }, { delay, e: ease.out });
}
function flashRing(color, delay = 0) {
  later(delay, () => torch.ringMat.color.set(color).multiplyScalar(2));
  tween(1.2, (e, k) => { torch.ringMat.opacity = Math.sin(k * Math.PI); }, { delay, e: ease.lin });
}

function drawArc(a, b, h, color, { delay = 0, dur = .7, hold = .5, r = .028 } = {}) {
  const mid = a.clone().add(b).multiplyScalar(.5);
  mid.y += h;
  const geo = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone()), 80, r, 8, false);
  const mat = new THREE.MeshBasicMaterial({ color: bright(color, 1.8), transparent: true, opacity: .9, toneMapped: false, depthWrite: false });
  const m = new THREE.Mesh(geo, mat);
  m.userData.ownGeo = true;
  geo.setDrawRange(0, 0);
  transient.add(m);
  tween(dur, k => geo.setDrawRange(0, Math.floor(k * 80) * 48), { delay, e: ease.io });
  tween(.6, k => { mat.opacity = .9 * (1 - k); }, { delay: delay + dur + hold });

      box.add(new THREE.Mesh(new THREE.BoxGeometry(1.12, 1.12, .22), basic(C.green, .9)));
      addEdges(box, bright(C.green, 1.4));
      own(box);
      box.castShadow = true;
      transient.add(box);
      tween(.8, k => { box.position.set(-1.9, .85 + (1 - k) * 3, 0); box.rotation.y = (1 - k) * 2; }, { delay: .3, e: ease.back });
      burst(v3(-1.9, .4, 0), [C.green, C.warm], { delay: 1.0, n: 60, speed: 2, life: .9 });
      const ghost = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.1, 1.1, 1.1)),
        new THREE.LineDashedMaterial({ color: 0x9aa6b3, dashSize: .1, gapSize: .07 }));
      ghost.computeLineDistances();
      ghost.position.set(1.9, .85, 0);
      ghost.userData.ownGeo = true;
      transient.add(ghost);
      const pts = new THREE.QuadraticBezierCurve3(v3(-1.2, 1.6, 0), v3(0, 2.8, 0), v3(1.2, 1.6, 0)).getPoints(60);
      const arc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color: 0x9aa6b3, dashSize: .1, gapSize: .08 }));
      arc.computeLineDistances();
      arc.geometry.setDrawRange(0, 0);
      arc.userData.ownGeo = true;
      transient.add(arc);
      tween(1, k => arc.geometry.setDrawRange(0, Math.floor(k * 61)), { delay: 1.8 });
      tag('✓ GitHub · today', v3(-1.9, 0, 1.3), 'green', 1.0);
      tag('PyPI · next', v3(1.9, 0, 1.3), '', 2.4);
    },
  },
  {
    sec: 3, kicker: 'Itara · light, in Kinyarwanda', title: 'Itara', big: true, torch: true, end: true,
    show: ['repo', 'model', ...TEAM], cam: [v3(0, 9, 23), v3(-1, 3.2, 0)], light: .25, dur: 9,
    play() {
      torch.lightsBlocks = true;
      torch.pos.set(-3, 7.5, 5);
      torch.target.copy(topOf(0));
      torch.radius = 1.2;
      ignite(.3, 1.0);
      tweenVec(torch.target, topOf(3), 1.4, { delay: 1.3 });
      tweenVec(torch.target, topOf(11), 1.2, { delay: 2.8 });
      tweenVec(torch.target, v3(-1.4, .8, 4.6), 1.2, { delay: 4.2 });
      tweenVec(torch.target, P.modelChest, 1.2, { delay: 5.6 });
      kvSweep(modelKV, 0, 1, C.green, .8, 6.4);
    },
  },
];
const SEC_START = SECTIONS.map((_, n) => scenes.findIndex(s => s.sec === n));

// ---------- navigation ----------
const chapterEl = document.getElementById('chapter');
const dotsEl = document.getElementById('dots');
const dots = [];
SECTIONS.forEach((name, n) => {
  const group = document.createElement('div');
  group.className = 'sec';
  group.innerHTML = `<i>${name}</i><div class="row"></div>`;
  scenes.forEach((s, i) => {
    if (s.sec !== n) return;
    const b = document.createElement('button');
    b.setAttribute('aria-label', `Scene ${i + 1}`);
    b.addEventListener('click', e => { e.stopPropagation(); goTo(i); });
    group.querySelector('.row').appendChild(b);
    dots[i] = b;
  });
  dotsEl.appendChild(group);
});
let current = -1, chapterTimer, autoTimer, autoplay = false;
function setChapter(s, instant) {
  clearTimeout(chapterTimer);
  const apply = () => {
    chapterEl.querySelector('.kicker').textContent = s.kicker;
    chapterEl.querySelector('h1').textContent = s.title;
    chapterEl.classList.toggle('out', !s.kicker && !s.title);
  };
  if (instant) return apply();
  chapterEl.classList.add('out');
  chapterTimer = setTimeout(apply, 380);
}
function base(i, instant) {
  const s = scenes[i];
  tweens = [];
  clearTransient();
  labels.forEach(L => L.el.classList.remove('on'));
  setMeters([]);
  heroEl.className = '';
  blocks.forEach(b => { setRise(b, 1); b.userData.gk = 0; });
  for (const c of ramChips) { c.k = 0; c.col.set(C.green); c.glyph.visible = false; c.glyphMat.color.copy(bright(C.amber, 1.6)); }
  kvReset(modelKV); kvReset(rackKV);
  gauge.userData.needle.rotation.z = 0;
  needleMat.color.copy(bright(C.text, 1.2));
  spark.userData.spin = 1;
  bookPivot.rotation.z = 0;
  lock.rotation.z = 0;
  torch.on = 0;
  torch.lightsBlocks = false;
  torch.color.set(C.warm);
  torch.radius = 1;
  torch.ringMat.opacity = 0;
  tweenScale(torch.group, s.torch ? 1 : .001, instant ? .01 : .4);
  shellMat.uniforms.uColor.value.set(C.shell);
  tweenProp(shellMat.uniforms.uI, 'value', .6, .6);
  tweenProp(world, 'k', s.light, instant ? .01 : 1.2);
  setStage(s, instant);
}
function goTo(i, instant = false) {
  i = Math.max(0, Math.min(scenes.length - 1, i));
  current = i;
  const s = scenes[i];
  base(i, instant);
  if (instant) { cam.pos.copy(s.cam[0]); cam.look.copy(s.cam[1]); } else cameraTo(s.cam[0], s.cam[1], 1.8);
  setChapter(s, instant);
  document.body.classList.toggle('title', !!s.big);
  dots.forEach((d, n) => d.classList.toggle('on', n === i));
  [...dotsEl.children].forEach((g, n) => g.classList.toggle('on', n === s.sec));
  history.replaceState(null, '', location.search + '#' + (i + 1));
  s.play();
  clearTimeout(autoTimer);
  if (autoplay && !s.end) autoTimer = setTimeout(() => goTo(current + 1), s.dur * 1000);
}
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); goTo(current + 1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); goTo(current - 1); }
  else if (e.key === 'r' || e.key === 'R') goTo(current);
  else if (e.key === 'a' || e.key === 'A') { autoplay = !autoplay; goTo(current); }
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean');
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (/^[1-4]$/.test(e.key)) goTo(SEC_START[Number(e.key) - 1]);
});
canvas.addEventListener('click', () => goTo(current + 1));

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1.3 ? 54 : 40;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.resolution.set(w, h);
}
addEventListener('resize', resize);
resize();

// ---------- loop ----------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  now = clock.elapsedTime;
  stepTweens(dt);
  hemi.intensity = .32 + .4 * world.k;
  key.intensity = .22 + .6 * world.k;
  rim.intensity = .08 + .3 * world.k;
  camera.position.copy(cam.pos).add(tmpV.set(Math.sin(now * .15) * .25, Math.sin(now * .21) * .12, 0));
  camera.lookAt(cam.look);
  spark.rotation.y += dt * spark.userData.spin;
  spark.rotation.x += dt * spark.userData.spin * .4;
  spark.userData.spin = lerp(spark.userData.spin, 1, dt * 1.2);
  for (const f of gpu.userData.fans) f.rotation.z -= dt * 9;
  gauge.quaternion.copy(camera.quaternion);
  updateTorch(now);
  updateBlocks();
  updateRam();
  updateKV(modelKV);
  updateKV(rackKV);
  composer.render();
  updateLabels();
  requestAnimationFrame(frame);
}
const params = new URLSearchParams(location.search);
if (params.has('rec')) document.body.classList.add('clean');
const start = Number(location.hash.slice(1)) - 1;
goTo(Number.isInteger(start) && start >= 0 ? start : 0, true);
// ?at=4 skips 4 seconds into the scene, for stills
const at = Number(params.get('at')) || 0;
for (let s = 0; s < at; s += 1 / 60) { now += 1 / 60; stepTweens(1 / 60); }
document.getElementById('boot').remove();
frame();
</script>
